<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" role="img" aria-labelledby="place-title place-desc">
<style>
text { font-family: Arial, sans-serif; fill: #14243a; }
.small { font-size: 13px; fill: #536277; }
.label { font-size: 18px; font-weight: 700; }
.node { fill: #fffefa; stroke: #aab5c2; stroke-width: 1.5; }
.accent { fill: #fff0e2; stroke: #e36d12; stroke-width: 2; }
.zone { fill: #f1f4f6; stroke: #aab5c2; stroke-width: 1.5; }
.edge { stroke: #40526a; stroke-width: 2; fill: none; marker-end: url(#arrow); }
</style>
<rect width="100%" height="100%" fill="#faf8f3"/>

      <title id="place-title">The same application image in EKS and kind with separate stores</title>
      <desc id="place-desc">A single application image feeds an EKS deployment in a Region and a kind deployment on a laptop. EKS connects to a Region database. kind connects to its own PostgreSQL. There is no data replication arrow between the stores.</desc>
      <defs><marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#40526a"/></marker></defs>
      <rect x="367" y="15" width="265" height="70" rx="10" class="accent"/><text x="500" y="48" text-anchor="middle" class="label">Application image</text><text x="500" y="68" text-anchor="middle" class="small">matched in 28 Sep 2026 proof</text>
      <rect x="28" y="125" width="445" height="190" rx="14" class="zone"/><rect x="527" y="125" width="445" height="190" rx="14" class="zone"/>
      <text x="50" y="153" class="small">IN REGION</text><text x="549" y="153" class="small">LAPTOP · ON-PREM STAND-IN</text>
      <rect x="50" y="171" width="168" height="85" rx="9" class="node"/><text x="134" y="208" text-anchor="middle" class="label">EKS</text><text x="134" y="233" text-anchor="middle" class="small">own settings</text>
      <rect x="282" y="171" width="168" height="85" rx="9" class="node"/><text x="366" y="208" text-anchor="middle" class="label">Region store</text><text x="366" y="233" text-anchor="middle" class="small">DynamoDB / Aurora</text>
      <rect x="549" y="171" width="168" height="85" rx="9" class="node"/><text x="633" y="208" text-anchor="middle" class="label">kind</text><text x="633" y="233" text-anchor="middle" class="small">own settings</text>
      <rect x="781" y="171" width="168" height="85" rx="9" class="node"/><text x="865" y="208" text-anchor="middle" class="label">PostgreSQL</text><text x="865" y="233" text-anchor="middle" class="small">local cluster</text>
      <path d="M500 86 V104 H134 V163" stroke="#40526a" stroke-width="2" fill="none" marker-end="url(#arrow2)"/><path d="M500 104 H633 V163" stroke="#40526a" stroke-width="2" fill="none" marker-end="url(#arrow2)"/><path d="M220 213 H274" stroke="#40526a" stroke-width="2" fill="none" marker-end="url(#arrow2)"/><path d="M719 213 H773" stroke="#40526a" stroke-width="2" fill="none" marker-end="url(#arrow2)"/>
      <text x="500" y="350" text-anchor="middle" class="small">Separate data boundary · no replication is shown or claimed</text>
    </svg>
