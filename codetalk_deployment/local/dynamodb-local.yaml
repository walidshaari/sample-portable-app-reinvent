# DEVELOPMENT AND TESTING ONLY.
#
# DynamoDB Local speaks the DynamoDB API so the unchanged DynamoDB adapter can
# run on a laptop with a configuration change. AWS documents it as intended
# for development and testing, not production: no durability (-inMemory),
# no high availability, no IAM, and throughput limits are not simulated.
# https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/DynamoDBLocal.UsageNotes.html
apiVersion: v1
kind: Namespace
metadata:
  name: dev-tools
  labels:
    purpose: development-and-testing-only
    pod-security.kubernetes.io/enforce: baseline
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dynamodb-local
  namespace: dev-tools
  labels:
    app: dynamodb-local
    purpose: development-and-testing-only
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dynamodb-local
  template:
    metadata:
      labels:
        app: dynamodb-local
        purpose: development-and-testing-only
    spec:
      automountServiceAccountToken: false
      containers:
        - name: dynamodb-local
          image: public.ecr.aws/aws-dynamodb-local/aws-dynamodb-local:3.3.1@sha256:ff89bd48ff32cd8d9be5fee8873b65b8854dc408f1afe881be6eb00247bc0dab
          args: ["-jar", "DynamoDBLocal.jar", "-inMemory", "-sharedDb"]
          ports:
            - containerPort: 8000
          readinessProbe:
            tcpSocket:
              port: 8000
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: dynamodb-local
  namespace: dev-tools
spec:
  selector:
    app: dynamodb-local
  ports:
    - port: 8000
      targetPort: 8000
