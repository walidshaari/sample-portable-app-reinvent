# Where PostgreSQL credentials come from on-premises: the Secret "pg-app"
# that CloudNativePG generates in the cluster. Optional, so the DynamoDB Local
# configuration runs without it. Compare with overlays/region, where the
# Secret comes from AWS Secrets Manager through External Secrets Operator.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: portable-app
spec:
  template:
    spec:
      containers:
        - name: app
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POSTGRES_HOST
              valueFrom:
                secretKeyRef: {name: pg-app, key: host, optional: true}
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef: {name: pg-app, key: dbname, optional: true}
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef: {name: pg-app, key: username, optional: true}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: pg-app, key: password, optional: true}
