# EKS Auto Mode provisions a Network Load Balancer for a Service of type
# LoadBalancer. Client access is limited by spec.loadBalancerSourceRanges,
# set from ALLOWED_CIDR in .generated/ (never 0.0.0.0/0 by default).
apiVersion: v1
kind: Service
metadata:
  name: portable-app
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
spec:
  type: LoadBalancer
