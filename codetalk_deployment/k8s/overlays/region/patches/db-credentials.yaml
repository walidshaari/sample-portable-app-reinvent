# Where PostgreSQL credentials come from in the Region: the Secret "app-db",
# kept in sync from AWS Secrets Manager by External Secrets Operator. It is
# optional, so the DynamoDB configuration runs without it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: portable-app
spec:
  template:
    spec:
      containers:
        - name: app
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-db
                optional: true
